---
- name: R_qsort
  family:
    - R_qsort_I
    - R_qsort_int
    - R_qsort_int_I
  summary: Sort a numeric array in place using quicksort.
  signature: |
    void R_qsort    (double *v,         size_t i, size_t j);
    void R_qsort_I  (double *v, int *II, int i, int j);
    void R_qsort_int  (int *iv,         size_t i, size_t j);
    void R_qsort_int_I(int *iv, int *II, int i, int j);
  status: api
  header: R_ext/Utils.h
  protect: n/a
  errors: never
  r_equivalent: sort()
  notes: |
    The dummy index argument is renamed to `II` to avoid problems with
    g++ on Solaris.
  see_also:
    - R_isort
    - R_orderVector
  chapter: utilities
  section: Sorting
- name: R_isort
  family:
    - R_rsort
    - R_csort
  summary: Sort an int, double, or complex array in place.
  signature: |
