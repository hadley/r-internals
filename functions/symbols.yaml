- name: PRINTNAME
  family: SET_PRINTNAME
  summary: Get or set the print name of a symbol.
  signature: |
    SEXP (PRINTNAME)(SEXP x);
    void SET_PRINTNAME(SEXP x, SEXP v);
  status: non-api
  header: Rinternals.h
  protect: not-needed
  errors: never
  notes: |
    The value of the symbol, as a CHARSXP. Use `CHAR(PRINTNAME(x))` to get
    the name as a `const char*`.
  see_also: []
  chapter: symbols
  section: Internals
