---
- name: Rf_isSymbol
  family: []
  summary: Test whether an object is a symbol.
  signature: |
    Rboolean Rf_isSymbol(SEXP s);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  r_equivalent: is.symbol()
  see_also: []
  chapter: symbols
  section: Test
- name: Rf_install
  family: Rf_installChar
  summary: "Create the symbol for a name, returning the existing symbol if already present."
  signature: |
    SEXP Rf_install(const char *);
    SEXP Rf_installChar(SEXP);
  status: api
  header: Rinternals.h
  protect: not-needed
  errors: can-throw
  r_equivalent: as.name()
  notes: |
    Symbols are never garbage collected, so `SYMSXP`s don't need to be
    protected. Cache frequently used symbols to avoid repeated lookups.
  see_also: []
  chapter: symbols
  section: Create
