- name: R_MakeExternalPtr
  family: []
  summary: Create an external pointer wrapping a C pointer.
  signature: |
    SEXP R_MakeExternalPtr(void *p, SEXP tag, SEXP prot);
  returns: "A new external pointer (`EXTPTRSXP`) wrapping `p`."
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  notes: |
    `tag` and `prot` are arbitrary SEXPs stored alongside the C pointer;
    `prot` stays protected from garbage collection while the external
    pointer is reachable.
  see_also: []
  chapter: external-pointers
  section: Create and access
- name: R_ClearExternalPtr
  family: []
  summary: Clear the address stored in an external pointer.
  signature: |
    void R_ClearExternalPtr(SEXP s);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  see_also: []
  chapter: external-pointers
  section: Create and access
- name: R_ExternalPtrAddr
  family:
    - R_ExternalPtrTag
    - R_ExternalPtrProtected
    - R_SetExternalPtrAddr
    - R_SetExternalPtrTag
    - R_SetExternalPtrProtected
  summary: >-
    Get and set the address, tag, and protected fields of an external pointer.
  signature: |
    void *R_ExternalPtrAddr(SEXP s);
    SEXP R_ExternalPtrTag(SEXP s);
    SEXP R_ExternalPtrProtected(SEXP s);
    void R_SetExternalPtrAddr(SEXP s, void *p);
    void R_SetExternalPtrTag(SEXP s, SEXP tag);
    void R_SetExternalPtrProtected(SEXP s, SEXP p);
  returns: "`R_ExternalPtrAddr()` returns the stored C pointer; `R_ExternalPtrTag()` and `R_ExternalPtrProtected()` return the tag and protected fields."
  status: api
  header: Rinternals.h
  protect: not-needed
  errors: never
  see_also: []
  chapter: external-pointers
  section: Create and access
- name: R_RegisterCFinalizer
  family:
    - R_RegisterFinalizer
    - R_RegisterFinalizerEx
    - R_RegisterCFinalizerEx
  summary: >-
    Register a finalizer to run when an external pointer is garbage collected.
  signature: |
    void R_RegisterFinalizer(SEXP s, SEXP fun);
    void R_RegisterCFinalizer(SEXP s, R_CFinalizer_t fun);
    void R_RegisterFinalizerEx(SEXP s, SEXP fun, Rboolean onexit);
    void R_RegisterCFinalizerEx(SEXP s, R_CFinalizer_t fun, Rboolean onexit);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: can-throw
  notes: |
    `R_RegisterFinalizer()` takes an R function and `R_RegisterCFinalizer()`
    a C function of type `R_CFinalizer_t`. The `Ex` variants add an `onexit`
    argument controlling whether the finalizer also runs when R shuts down.
  see_also: []
  chapter: external-pointers
  section: Finalization
- name: R_MakeWeakRef
  family: R_MakeWeakRefC
  summary: Create a weak reference.
  signature: |
    SEXP R_MakeWeakRef(SEXP key, SEXP val, SEXP fin, Rboolean onexit);
    SEXP R_MakeWeakRefC(SEXP key, SEXP val, R_CFinalizer_t fin, Rboolean onexit);
  returns: "A newly created weak reference object."
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  notes: |
    `R_MakeWeakRef()` takes an R function finalizer; `R_MakeWeakRefC()` takes
    a C finalizer of type `R_CFinalizer_t`.
  see_also: []
  chapter: external-pointers
  section: Weak references
- name: R_WeakRefKey
  family: R_WeakRefValue
  summary: Get the key or value of a weak reference.
  signature: |
    SEXP R_WeakRefKey(SEXP w);
    SEXP R_WeakRefValue(SEXP w);
  returns: "`R_WeakRefKey()` returns the key and `R_WeakRefValue()` the value stored in `w`."
  status: api
  header: Rinternals.h
  protect: not-needed
  errors: never
  see_also: []
  chapter: external-pointers
  section: Weak references
- name: R_RunWeakRefFinalizer
  family: []
  summary: Run the finalizer attached to a weak reference.
  signature: |
    void R_RunWeakRefFinalizer(SEXP w);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: can-throw
  see_also: []
  chapter: external-pointers
  section: Weak references
- name: R_MakeExternalPtrFn
  family: R_ExternalPtrAddrFn
  summary: Wrap a C function pointer in an external pointer.
  signature: |
    SEXP R_MakeExternalPtrFn(DL_FUNC p, SEXP tag, SEXP prot);
    DL_FUNC R_ExternalPtrAddrFn(SEXP s);
  returns: "`R_MakeExternalPtrFn()` returns a new external pointer wrapping `p`; `R_ExternalPtrAddrFn()` returns the stored function pointer."
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  args:
    p: the function pointer to wrap.
    tag: an identifying tag, often `R_NilValue`.
    prot: an object to protect from GC while the pointer lives.
  notes: |
    The function-pointer analogue of `R_MakeExternalPtr()`; storing a
    `DL_FUNC` directly avoids casting between object and function
    pointers, which is undefined behaviour in C.
  see_also:
    - R_MakeExternalPtr
    - R_ExternalPtrAddr
  chapter: external-pointers
  section: Create and access
