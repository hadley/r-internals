---
- name: R_MakeExternalPtr
  family: []
  summary: Create an external pointer wrapping a C pointer.
  signature: |
    SEXP R_MakeExternalPtr(void *p, SEXP tag, SEXP prot);
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  notes: |
    `tag` and `prot` are arbitrary SEXPs stored alongside the C pointer;
    `prot` stays protected from garbage collection while the external
    pointer is reachable.
  see_also: []
  chapter: external-pointers
  section: Create and access
- name: R_ClearExternalPtr
  family: []
  summary: Clear the address stored in an external pointer.
  signature: |
    void R_ClearExternalPtr(SEXP s);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  see_also: []
  chapter: external-pointers
  section: Create and access
- name: R_ExternalPtrAddr
  family:
    - R_ExternalPtrTag
    - R_ExternalPtrProtected
    - R_SetExternalPtrAddr
    - R_SetExternalPtrTag
    - R_SetExternalPtrProtected
  summary: "Get and set the address, tag, and protected fields of an external pointer."
  signature: |
    void *R_ExternalPtrAddr(SEXP s);
    SEXP R_ExternalPtrTag(SEXP s);
    SEXP R_ExternalPtrProtected(SEXP s);
    void R_SetExternalPtrAddr(SEXP s, void *p);
    void R_SetExternalPtrTag(SEXP s, SEXP tag);
    void R_SetExternalPtrProtected(SEXP s, SEXP p);
  status: api
  header: Rinternals.h
  protect: not-needed
  errors: never
  see_also: []
  chapter: external-pointers
  section: Create and access
- name: R_RegisterCFinalizer
  family:
    - R_RegisterFinalizer
    - R_RegisterFinalizerEx
    - R_RegisterCFinalizerEx
  summary: Register a finalizer to run when an external pointer is garbage collected.
  signature: |
    void R_RegisterFinalizer(SEXP s, SEXP fun);
    void R_RegisterCFinalizer(SEXP s, R_CFinalizer_t fun);
    void R_RegisterFinalizerEx(SEXP s, SEXP fun, Rboolean onexit);
    void R_RegisterCFinalizerEx(SEXP s, R_CFinalizer_t fun, Rboolean onexit);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: can-throw
  notes: |
    `R_RegisterFinalizer()` takes an R function and `R_RegisterCFinalizer()`
    a C function of type `R_CFinalizer_t`. The `Ex` variants add an `onexit`
    argument controlling whether the finalizer also runs when R shuts down.
  see_also: []
  chapter: external-pointers
  section: Finalization
- name: R_RunPendingFinalizers
  family: []
  summary: Run any pending finalizers.
  signature: |
    void R_RunPendingFinalizers(void);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: can-throw
  see_also: []
  chapter: external-pointers
  section: Finalization
- name: EXTPTR_PTR
  family:
    - EXTPTR_PROT
    - EXTPTR_TAG
  summary: Access the fields of an external pointer directly.
  signature: |
    #define EXTPTR_PTR(x)	CAR(x)
    #define EXTPTR_PROT(x)	CDR(x)
    #define EXTPTR_TAG(x)	TAG(x)
  status: non-api
  replacement: R_ExternalPtrAddr
  header: Rinternals.h
  protect: not-needed
  errors: never
  notes: |
    Read the fields directly from the underlying cons cell. Use
    `R_ExternalPtrAddr()`, `R_ExternalPtrProtected()`, and
    `R_ExternalPtrTag()` instead.
  see_also: R_ExternalPtrAddr
  chapter: external-pointers
  section: Internals
- name: R_MakeWeakRef
  family: R_MakeWeakRefC
  summary: Create a weak reference.
  signature: |
    SEXP R_MakeWeakRef(SEXP key, SEXP val, SEXP fin, Rboolean onexit);
    SEXP R_MakeWeakRefC(SEXP key, SEXP val, R_CFinalizer_t fin, Rboolean onexit);
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  notes: |
    `R_MakeWeakRef()` takes an R function finalizer; `R_MakeWeakRefC()` takes
    a C finalizer of type `R_CFinalizer_t`.
  see_also: []
  chapter: external-pointers
  section: Weak references
- name: R_WeakRefKey
