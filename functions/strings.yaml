---
- name: cetype_t
  family:
    - CE_NATIVE
    - CE_UTF8
    - CE_LATIN1
    - CE_BYTES
    - CE_SYMBOL
    - CE_ANY
  summary: Enumerate the encodings a CHARSXP can carry.
  signature: |
    typedef enum {
      CE_NATIVE = 0,
      CE_UTF8   = 1,
      CE_LATIN1 = 2,
      CE_BYTES  = 3,
      CE_SYMBOL = 5,
      CE_ANY    = 99
    } cetype_t;
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  notes: |
    One of `CE_NATIVE`, `CE_UTF8`, `CE_LATIN1`, `CE_BYTES`, `CE_SYMBOL`, or
    `CE_ANY`.
  see_also: Rf_getCharCE
  chapter: strings
  section: Encodings
- name: Rf_getCharCE
  family: []
  summary: Get the encoding of a CHARSXP.
  signature: |
    cetype_t Rf_getCharCE(SEXP);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  see_also: cetype_t
  chapter: strings
  section: Encodings
- name: Rf_mkChar
  family: Rf_mkCharLen
  summary: Create a CHARSXP from a C string in the current encoding.
  signature: |
    SEXP Rf_mkChar(const char* x);
    SEXP Rf_mkCharLen(const char* x, int n);
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  notes: |
    `Rf_mkChar()` takes a null-terminated string; `Rf_mkCharLen()` takes an
    explicit length. Protection is rarely needed since the result is usually
    assigned immediately into a `STRSXP`. Both crash R on `NULL` input, so
    check for it yourself and substitute `""` or `NA_STRING`.
  see_also:
    - Rf_mkCharCE
    - Rf_ScalarString
  chapter: strings
  section: Creating from C strings
- name: Rf_mkCharCE
  family: Rf_mkCharLenCE
  summary: Create a CHARSXP from a C string in a specified encoding.
  signature: |
    SEXP Rf_mkCharCE(const char* x, cetype_t encoding);
    SEXP Rf_mkCharLenCE(const char* x, int n, cetype_t encoding);
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  notes: |
    Prefer these over `Rf_mkChar()` and `Rf_mkString()` when the input is
    UTF-8, which is typical for modern C code.
  see_also:
    - cetype_t
    - Rf_mkChar
  chapter: strings
  section: Creating from C strings
- name: Rf_ScalarString
  family: Rf_mkString
  summary: Create a length-1 STRSXP from a CHARSXP or C string.
  signature: |
    SEXP Rf_ScalarString(SEXP);
    SEXP Rf_mkString(const char*);
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  notes: |
    `Rf_ScalarString()` builds a `STRSXP` from a `CHARSXP`; `Rf_mkString()`
    builds one from a C string. Both crash R on `NULL` input.
  see_also: Rf_mkChar
  chapter: strings
  section: Creating from C strings
- name: CHAR
  family: R_CHAR
  summary: Access the underlying C string stored in a CHARSXP.
  signature: |
    const char* R_CHAR(SEXP x);
    #define CHAR(x) R_CHAR(x)
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  notes: |
    Named `CHAR()` for consistency with the other vector accessors
    (`LOGICAL()`, `INTEGER()`, ...).
  see_also: Rf_translateCharUTF8
  chapter: strings
  section: Convert to C string
- name: Rf_translateCharUTF8
  family:
    - Rf_translateChar
    - Rf_translateChar0
  summary: Translate a CHARSXP to a C string in a specified encoding.
  signature: |
    const char* Rf_translateChar(SEXP x);
    const char* Rf_translateChar0(SEXP x);
    const char* Rf_translateCharUTF8(SEXP x);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: can-throw
  notes: |
    `Rf_translateChar()` translates to the native encoding;
    `Rf_translateChar0()` leaves bytes-encoded strings alone and otherwise
    translates to native; `Rf_translateCharUTF8()` translates to UTF-8, which
    is what most modern C APIs want. A re-encoded `char*` is allocated with
    `R_alloc()` and freed automatically after the `.C`/`.Call`/`.External`
    returns; copy it if you need to keep it longer.
  see_also: CHAR
  chapter: strings
  section: Convert to C string
- name: NA_STRING
  family: R_NaString
  summary: Use the singleton CHARSXP representing NA.
  signature: |
    SEXP R_NaString; // Singleton CHARSXP
    #define NA_STRING R_NaString
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  r_equivalent: NA_character_
  notes: |
    `R_NaString` is a singleton `CHARSXP`; `NA_STRING` is the macro alias.
  see_also: R_BlankString
  chapter: strings
  section: Special values
- name: R_BlankString
  family: R_BlankScalarString
  summary: Use the global blank string objects.
  signature: |
    SEXP R_BlankString; // CHARSXP
    SEXP R_BlankScalarString; // STRSXP
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  r_equivalent: "\"\""
  notes: |
    `R_BlankString` is a `CHARSXP`; `R_BlankScalarString` is a `STRSXP`.
  see_also: NA_STRING
  chapter: strings
  section: Special values
- name: Rf_StringBlank
  family: Rf_isBlankString
  summary: Check whether a string is blank.
  signature: |
    Rboolean Rf_StringBlank(SEXP);
    Rboolean Rf_isBlankString(const char *);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  notes: |
    `Rf_StringBlank()` takes a `SEXP`; `Rf_isBlankString()` takes a
    `const char*`.
  see_also: R_BlankString
  chapter: strings
  section: Special values
- name: Rf_isValidString
  family: Rf_isValidStringF
  summary: Check whether a STRSXP holds at least one valid string.
  signature: |
    Rboolean Rf_isValidString(SEXP);
    Rboolean Rf_isValidStringF(SEXP);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  notes: |
    `Rf_isValidString(x)` is `TYPEOF(x) == STRSXP && LENGTH(x) > 0 &&
    TYPEOF(STRING_ELT(x, 0)) != NILSXP`; `Rf_isValidStringF(x)` is
    `isValidString(x) && CHAR(STRING_ELT(x, 0))[0]`.
  see_also: []
  chapter: strings
  section: Special values
- name: R_nchar
  family: []
  summary: >-
    Compute the length of a string in bytes, characters, or display width.
  signature: |
    typedef enum {Bytes, Chars, Width} nchar_type;
    int R_nchar(SEXP string, nchar_type type_,
      Rboolean allowNA, Rboolean keepNA, const char* msg_name);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: can-throw
  r_equivalent: nchar()
  notes: |
    `nchar_type` is one of `Bytes`, `Chars`, or `Width`.
  see_also: []
  chapter: strings
  section: Helper functions
- name: Rf_acopy_string
  family: []
  summary: Copy a C string into memory allocated by R_alloc().
  signature: |
    char* Rf_acopy_string(const char *);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: can-throw
  notes: |
    The copy is freed automatically at the next garbage collection.
  see_also: []
  chapter: strings
  section: Helper functions
- name: Rf_asChar
  family: []
  summary: Render an R object to a CHARSXP.
  signature: |
    SEXP Rf_asChar(SEXP x);
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  r_equivalent: as.character()
  see_also: []
  chapter: strings
  section: Helper functions
- name: Rf_NonNullStringMatch
  family: []
  summary: Check that two strings are equal and neither NA nor empty.
  signature: |
    Rboolean Rf_NonNullStringMatch(SEXP s, SEXP t);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: can-throw
  notes: |
    Translates both strings to UTF-8 before comparing.
  see_also: []
  chapter: strings
  section: Helper functions
- name: Rf_reEnc
  family: []
  summary: Re-encode a C string from one encoding to another.
  signature: >
    const char *Rf_reEnc(const char *x, cetype_t ce_in, cetype_t ce_out, int
    subst);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: can-throw
  see_also: cetype_t
  chapter: strings
  section: Helper functions
- name: R_ExpandFileName
  family: []
  summary: Expand a path containing ~ to a full path.
  signature: |
    const char *R_ExpandFileName(const char *);
  status: api
  header: R_ext/Utils.h
  protect: n/a
  errors: never
  r_equivalent: path.expand()
  notes: |
    Needed because most C APIs don't understand `~`.
  see_also: []
  chapter: strings
  section: Paths
- name: Rf_str2type
  family: []
  summary: Convert a C string to a SEXPTYPE.
  signature: |
    SEXPTYPE Rf_str2type(const char *);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  see_also: Rf_type2str
  chapter: strings
  section: Types
- name: Rf_type2str
  family:
    - Rf_type2char
    - Rf_type2rstr
    - Rf_type2str_nowarn
  summary: Convert a SEXPTYPE to a string.
  signature: |
    const char * Rf_type2char(SEXPTYPE);
    SEXP Rf_type2rstr(SEXPTYPE);
    SEXP Rf_type2str(SEXPTYPE);
    SEXP Rf_type2str_nowarn(SEXPTYPE);
  status: api
  header: Rinternals.h
  protect: result
  errors: never
  r_equivalent: typeof()
  notes: |
    `Rf_type2char()` returns a C string; `Rf_type2rstr()` returns a
    `STRSXP`; `Rf_type2str()` returns a `CHARSXP`. Only the `SEXP`-returning
    members need protection.
  see_also: Rf_str2type
  chapter: strings
  section: Types
