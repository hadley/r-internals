- name: Rf_listAppend
  family: []
  summary: Append one pairlist to another.
  signature: |
    SEXP Rf_listAppend(SEXP source, SEXP target);
  status: experimental
  header: Rinternals.h
  protect: not-needed
  errors: never
  notes: |
    Mutates `source` in place by walking to its last cell and setting its
    `CDR` to `target`; no new cells are allocated and the returned pairlist
    is the (mutated) `source` you already hold.
  see_also: []
  chapter: pairlists
  section: Creation
- name: CAR
  family:
    - CDR
    - CAAR
    - CDAR
    - CADR
    - CDDR
    - CDDDR
    - CADDR
    - CADDDR
    - CAD4R
    - CAD5R
  summary: Get the first element or a nested component of a CONS cell.
  signature: |
    SEXP CAR(SEXP e);
    SEXP CDR(SEXP e);
    SEXP CAAR(SEXP e);
    SEXP CDAR(SEXP e);
    SEXP CADR(SEXP e);
    SEXP CDDR(SEXP e);
    SEXP CDDDR(SEXP e);
    SEXP CADDR(SEXP e);
    SEXP CADDDR(SEXP e);
    SEXP CAD4R(SEXP e);
    SEXP CAD5R(SEXP e);
  status: api
  header: Rinternals.h
  protect: not-needed
  errors: never
  notes: |
    Pairlists can't be indexed directly, so these accessors navigate the
    linked list instead. `CAR()` returns the first element and `CDR()` the
    rest; they compose to give `CAAR()`, `CDAR()`, `CADDR()`, `CADDDR()`, and
    so on.
  see_also:
    - SETCAR
    - TAG
  chapter: pairlists
  section: Accessors
- name: SETCAR
  family:
    - SETCDR
    - SETCADR
    - SETCADDR
    - SETCADDDR
    - SETCAD4R
  summary: Set the first element or a nested component of a CONS cell.
  signature: |
    SEXP SETCAR(SEXP x, SEXP y);
    SEXP SETCDR(SEXP x, SEXP y);
    SEXP SETCADR(SEXP x, SEXP y);
    SEXP SETCADDR(SEXP x, SEXP y);
    SEXP SETCADDDR(SEXP x, SEXP y);
    SEXP SETCAD4R(SEXP e, SEXP y);
  status: api
  header: Rinternals.h
  protect: not-needed
  errors: never
  notes: |
    Mirror the `CAR()`/`CDR()` family of getters.
  see_also:
    - CAR
    - SET_TAG
  chapter: pairlists
  section: Accessors
