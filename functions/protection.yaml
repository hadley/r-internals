- name: R_PreserveObject
  family: R_ReleaseObject
  summary: "Preserve an object across C calls by adding it to R's precious list."
  signature: |
    void R_PreserveObject(SEXP);
    void R_ReleaseObject(SEXP);
  status: api
  replacement: ~
  header: Rinternals.h
  protect: n/a
  errors: never
  since: ~
  r_equivalent: ~
  args: ~
  notes: |
    Objects are added to `R_PreciousList`, a pairlist walked by the garbage
    collector. `R_ReleaseObject()` performs a linear search of this list, so
    repeatedly preserving and releasing many objects in the same order can
    cause quadratic slowdowns.
  example: ~
  see_also: PROTECT
  chapter: protection
  section: "R_PreserveObject, R_ReleaseObject"
