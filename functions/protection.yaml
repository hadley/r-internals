- name: PROTECT
  family:
    - UNPROTECT
    - PROTECT_WITH_INDEX
    - REPROTECT
  summary: Protect SEXPs from garbage collection.
  signature: |
    SEXP PROTECT(SEXP s);
    void UNPROTECT(int n);
    PROTECT_INDEX PROTECT_WITH_INDEX(SEXP s, PROTECT_INDEX *idx);
    void REPROTECT(SEXP s, PROTECT_INDEX idx);
  status: api
  replacement: ~
  header: Rinternals.h
  protect: n/a
  errors: never
  since: ~
  r_equivalent: ~
  args: ~
  notes: |
    `PROTECT()` pushes `s` onto the protection stack; `UNPROTECT(n)` pops the
    `n` most recent entries. Unbalanced use inside a loop can overflow the
    protection stack, since it is only reset automatically when your `.Call`
    entry point returns. Use `PROTECT_WITH_INDEX()`/`REPROTECT()` to re-protect
    a different value at the same stack depth, e.g. inside a loop.
  example: |
    SEXP out = PROTECT(Rf_allocVector(REALSXP, n));
    // ... fill out ...
    UNPROTECT(1);
    return out;
  see_also: R_PreserveObject
  chapter: protection
  section: Protect
