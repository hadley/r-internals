- name: DATAPTR_RO
  family: DATAPTR
  summary: Get an untyped pointer to a vector's data.
  signature: |
    const void *(DATAPTR_RO)(SEXP x);
    void *(DATAPTR)(SEXP x);
  returns: "An untyped pointer to the data payload of `x`; `DATAPTR()` is writable, `DATAPTR_RO()` read-only."
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  args:
    x: any vector.
  notes: |
    Prefer the typed accessors (`REAL()`, `INTEGER_RO()`, ...), which
    check the vector type. `DATAPTR()` gives write access;
    `DATAPTR_RO()` is read-only.
  see_also:
    - LOGICAL
    - INTEGER_RO
  chapter: vectors
  section: Get and set values
- name: INTEGER_RO
  family:
    - LOGICAL_RO
    - REAL_RO
    - COMPLEX_RO
    - RAW_RO
  summary: Get a read-only pointer to the underlying C array.
  signature: |
    const int*      (INTEGER_RO)(SEXP x);
    const int*      (LOGICAL_RO)(SEXP x);
    const double*   (REAL_RO)(SEXP x);
    const Rcomplex* (COMPLEX_RO)(SEXP x);
    const Rbyte*    (RAW_RO)(SEXP x);
  returns: "A read-only pointer to the underlying C array of `x`."
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  args:
    x: a vector of the corresponding type.
  notes: |
    Read-only variants of `INTEGER()` etc. Use them when you only read:
    the `const` pointer catches accidental writes, and ALTREP vectors can
    avoid materialising a writable copy.
  see_also:
    - LOGICAL
    - DATAPTR_RO
  chapter: vectors
  section: Get and set values
- name: INTEGER_ELT
  family:
    - LOGICAL_ELT
    - REAL_ELT
    - COMPLEX_ELT
    - RAW_ELT
    - SET_INTEGER_ELT
    - SET_LOGICAL_ELT
    - SET_REAL_ELT
    - SET_COMPLEX_ELT
    - SET_RAW_ELT
  summary: Get or set a single element of an atomic vector.
  signature: |
    int      (INTEGER_ELT)(SEXP x, R_xlen_t i);
    int      (LOGICAL_ELT)(SEXP x, R_xlen_t i);
    double   (REAL_ELT)(SEXP x, R_xlen_t i);
    Rcomplex (COMPLEX_ELT)(SEXP x, R_xlen_t i);
    Rbyte    (RAW_ELT)(SEXP x, R_xlen_t i);
    void SET_INTEGER_ELT(SEXP x, R_xlen_t i, int v);
    void SET_LOGICAL_ELT(SEXP x, R_xlen_t i, int v);
    void SET_REAL_ELT(SEXP x, R_xlen_t i, double v);
    void SET_COMPLEX_ELT(SEXP x, R_xlen_t i, Rcomplex v);
    void SET_RAW_ELT(SEXP x, R_xlen_t i, Rbyte v);
  returns: "The `*_ELT()` getters return the element at index `i` as the corresponding C type; the `SET_*_ELT()` setters return nothing."
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  args:
    x: a vector of the corresponding type.
    i: zero-based element index.
    v: the new value.
  notes: |
    Element-wise access is much slower than sweeping a cached pointer;
    use it when the type is not known in advance or only a few elements
    are touched.
  see_also:
    - LOGICAL
    - STRING_ELT
  chapter: vectors
  section: Get and set values
