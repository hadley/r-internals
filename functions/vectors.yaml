---
- name: Rf_xlength
  family: Rf_length
  summary: Get the length of a vector.
  signature: |
    R_xlen_t Rf_xlength(SEXP x);
    R_len_t Rf_length(SEXP x);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  r_equivalent: length()
  args:
    x: any vector.
  notes: |
    `Rf_xlength()` uses `R_xlen_t` and supports long vectors (length up to
    2^64 - 1); `Rf_length()` is limited to `int` (2^31 - 1).
    Also works on pairlists, where it is O(n).
  see_also:
    - Rf_lengthgets
    - LENGTH
  chapter: vectors
  section: Length
- name: Rf_lengthgets
  family: Rf_xlengthgets
  summary: >-
    Set the length of a vector by creating a new vector of extended length.
  signature: |
    SEXP Rf_lengthgets(SEXP x, R_len_t n);
    SEXP Rf_xlengthgets(SEXP x, R_xlen_t n);
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  r_equivalent: length<-
  args:
    x: a vector.
    n: the new length.
  notes: |
    `Rf_xlengthgets()` is the `R_xlen_t`-based variant for long vectors.
  see_also:
    - Rf_xlength
    - SETLENGTH
  chapter: vectors
  section: Length
- name: LENGTH
  family: XLENGTH
  summary: Get the length of a vector.
  signature: |
    int LENGTH(SEXP x);
    R_xlen_t XLENGTH(SEXP x);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  r_equivalent: length()
  args:
    x: any vector.
  notes: |
    Uppercase variants of `Rf_length()`/`Rf_xlength()`, implemented as
    macros in base R for efficiency.
  see_also:
    - Rf_xlength
    - SETLENGTH
  chapter: vectors
  section: Length
- name: IS_LONG_VEC
  family: []
  summary: Test whether a vector is a long vector.
  signature: |
    int IS_LONG_VEC(SEXP x);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  args:
    x: any vector.
  notes: |
    True when a vector's length exceeds the `int`-based limit of 2^31 - 1.
  see_also: Rf_xlength
  chapter: vectors
  section: Length
- name: Rf_allocVector
  family: []
  summary: Create a new vector of the given type and length.
  signature: |
    SEXP Rf_allocVector(SEXPTYPE type, R_xlen_t n);
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  r_equivalent: vector()
  args:
    type: >-
      any vector `SEXPTYPE` (`LGLSXP`, `INTSXP`, `REALSXP`, `CPLXSXP`, `STRSXP`,
      `VECSXP`, `RAWSXP`, `EXPRSXP`).
    n: number of elements; `R_xlen_t` supports long vectors on 64-bit platforms.
  notes: |
    Atomic vector contents are uninitialised; `VECSXP`/`EXPRSXP` elements are
    `R_NilValue` and `STRSXP` elements are `""`. Attributes are unset.
  example: |
    SEXP out = PROTECT(Rf_allocVector(REALSXP, n));
  see_also:
    - Rf_allocVector3
    - Rf_coerceVector
  chapter: vectors
  section: Create
- name: Rf_ScalarLogical
  family:
    - Rf_ScalarInteger
    - Rf_ScalarReal
    - Rf_ScalarComplex
    - Rf_ScalarRaw
  summary: Create a vector of length 1 from the corresponding C type.
  signature: |
    SEXP Rf_ScalarLogical(int x);
    SEXP Rf_ScalarInteger(int x);
    SEXP Rf_ScalarReal(double x);
    SEXP Rf_ScalarComplex(Rcomplex x);
    SEXP Rf_ScalarRaw(Rbyte x);
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  args:
    x: the C value to wrap.
  notes: |
    For strings, use [`Rf_ScalarString()`](#Rf_ScalarString) or
    [`Rf_mkString()`](#Rf_mkString) instead. `Rf_ScalarLogical()` returns cached
    singletons and never allocates; the other `Rf_Scalar*()` variants always
    allocate.
  see_also:
    - Rf_allocVector
    - Rf_ScalarString
    - Rf_mkString
  chapter: vectors
  section: Create
- name: Rf_coerceVector
  family: []
  summary: Coerce an existing vector to a different type.
  signature: |
    SEXP Rf_coerceVector(SEXP x, SEXPTYPE newtype);
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  r_equivalent: as.vector()
  args:
    x: a vector.
    newtype: the `SEXPTYPE` to coerce to.
  notes: |
    Errors if it can't coerce between `TYPEOF(x)` and `newtype`.
  see_also:
    - Rf_allocVector
    - Rf_asLogical
  chapter: vectors
  section: Create
- name: Rf_mkNamed
  family: []
  summary: Create a named vector of the given type.
  signature: |
    SEXP Rf_mkNamed(SEXPTYPE type, const char **names);
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  r_equivalent: setNames()
  args:
    type: any vector `SEXPTYPE`.
    names: a null-terminated array of `const char*` names.
  notes: |
    The vector's length matches the number of names supplied, and its names
    attribute is set from them.
  example: |
    // array of names; note the null string
    const char *names[] = {"xname", "yname", ""};
    SEXP list = PROTECT(Rf_mkNamed(VECSXP, names));  // creates a list of length 2
    SET_VECTOR_ELT(list, 0, x); // x and y are arbitrary SEXPs
    SET_VECTOR_ELT(list, 1, y);
    UNPROTECT(1);
  see_also: Rf_allocVector
  chapter: vectors
  section: Create
- name: Rf_allocVector3
  family: []
  summary: Create a new vector using a custom allocator.
  signature: |
    SEXP Rf_allocVector3(SEXPTYPE type, R_xlen_t n, R_allocator_t *allocator);
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  notes: |
    Like `Rf_allocVector()`, but memory for the data payload comes from
    `allocator`; pass `NULL` for plain `Rf_allocVector()` behaviour. Rarely
    needed in package code.
  see_also: Rf_allocVector
  chapter: vectors
  section: Create
- name: LOGICAL
  family:
    - INTEGER
    - REAL
    - COMPLEX
    - RAW
  summary: Get a pointer to the underlying C array of an atomic vector.
  signature: |
    int*      LOGICAL(SEXP x);
    int*      INTEGER(SEXP x);
    double*   REAL(SEXP x);
    Rcomplex* COMPLEX(SEXP x);
    Rbyte*    RAW(SEXP x);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  args:
    x: a vector of the corresponding type.
  notes: |
    For long vectors, cache the returned pointer and reuse it rather than
    calling the accessor on every iteration.
  example: |
    int* px = INTEGER(x);
    for (int i = 0; i < n; ++i) {
      px[i] = px[i] * 2;
    }
  see_also:
    - STRING_ELT
    - VECTOR_ELT
  chapter: vectors
  section: Get and set values
- name: STRING_ELT
  family: SET_STRING_ELT
  summary: Get or set a single element of a character vector.
  signature: |
    SEXP STRING_ELT(SEXP x, R_xlen_t i);
    void SET_STRING_ELT(SEXP x, R_xlen_t i, SEXP v);
  status: api
  header: Rinternals.h
  protect: not-needed
  errors: can-throw
  args:
    x: a `STRSXP`.
    i: zero-based element index.
    v: the `CHARSXP` to set.
  notes: |
    `STRING_ELT()` returns a `CHARSXP`, not an ordinary `SEXP` value; strings
    use a pair of accessor functions rather than a plain C array.
  see_also:
    - VECTOR_ELT
    - STRING_PTR
  chapter: vectors
  section: Get and set values
- name: VECTOR_ELT
  family: SET_VECTOR_ELT
  summary: Get or set a single element of a list.
  signature: |
    SEXP VECTOR_ELT(SEXP x, R_xlen_t i);
    SEXP SET_VECTOR_ELT(SEXP x, R_xlen_t i, SEXP v);
  status: api
  header: Rinternals.h
  protect: not-needed
  errors: can-throw
  args:
    x: a `VECSXP`.
    i: zero-based element index.
    v: the value to set.
  notes: |
    `VECTOR_ELT()` may return any `SEXPTYPE`; lists use a pair of accessor
    functions rather than a plain C array.
  see_also:
    - STRING_ELT
    - VECTOR_PTR
  chapter: vectors
  section: Get and set values
- name: Rf_asLogical
  family:
