- name: Rf_stringSuffix
  family: []
  summary: Extract the tail of a STRSXP.
  signature: |
    SEXP Rf_stringSuffix(SEXP string, int fromIndex);
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  r_equivalent: substring()
  args:
    string: a `STRSXP`.
    fromIndex: the index to start the suffix from.
  see_also: []
  chapter: vectors
  section: Miscellaneous helpers
- name: IS_SCALAR
  family: IS_SIMPLE_SCALAR
  summary: >-
    Test if an object is a scalar (a vector of length 1) of the given type.
  signature: |
    #define IS_SCALAR(x, type) (TYPEOF(x) == (type) && XLENGTH(x) == 1)
    #define IS_SIMPLE_SCALAR(x, type) (IS_SCALAR(x, type) && ATTRIB(x) == R_NilValue)
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  args:
    x: any SEXP.
    type: a `SEXPTYPE`.
  notes: |
    `IS_SIMPLE_SCALAR()` additionally requires that the object has no
    attributes.
  see_also: []
  chapter: vectors
  section: Miscellaneous helpers
- name: Rf_isVectorizable
  family: []
