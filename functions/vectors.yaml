  signature: |
    Rboolean Rf_isVectorizable(SEXP x);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  args:
    x: a list or pairlist.
  notes: |
    True when every element of the list or pairlist is a vector of length 0
    or 1.
  see_also: []
  chapter: vectors
  section: Miscellaneous helpers
- name: R_qsort
