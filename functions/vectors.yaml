- name: NA_REAL
  family: R_NaReal
  summary: Represent a missing double value.
  signature: |
    double R_NaReal;
    #define NA_REAL R_NaReal
  status: api
  header: R_ext/Arith.h
  protect: n/a
  errors: never
  r_equivalent: NA_real_
  notes: |
    Represented as an `NaN` with a specific bit pattern, per the IEEE 754
    floating-point standard.
  see_also:
    - R_NaN
    - ISNA
    - NA_LOGICAL
  chapter: vectors
  section: Special values
- name: R_NaN
  family:
    - R_PosInf
    - R_NegInf
  summary: Represent NaN and positive or negative infinity as doubles.
  signature: |
    double R_NaN;
    double R_PosInf;
    double R_NegInf;
  status: api
  header: R_ext/Arith.h
  protect: n/a
  errors: never
  r_equivalent: NaN
  notes: |
    Use these constants, together with `NA_REAL`, for cross-platform-safe
    NaN, infinite, and missing values.
  see_also:
    - NA_REAL
    - ISNA
  chapter: vectors
  section: Special values
- name: ISNA
  family:
    - ISNAN
    - R_FINITE
  summary: Check a double for missing, NaN, or non-finite values.
  signature: |
    int ISNA(double x);
    int ISNAN(double x);
    int R_FINITE(double x);
  status: api
  header: R_ext/Arith.h
  protect: n/a
  errors: never
  r_equivalent: is.na()
  args:
    x: the double to check.
  notes: |
    These are macros; `R_IsNA()`, `R_IsNaN()`, and `R_finite()` are the
    equivalent functions. Check `!R_FINITE()` for non-finite values.
  see_also:
    - R_IsNA
    - NA_REAL
  chapter: vectors
  section: Special values
- name: R_IsNA
  family:
    - R_IsNaN
    - R_finite
  summary: Check a double for missing, NaN, or non-finite values.
  signature: |
    int R_IsNA(double);
    int R_IsNaN(double);
    int R_finite(double);
  status: api
  header: R_ext/Arith.h
  protect: n/a
  errors: never
  r_equivalent: is.finite()
  notes: |
    Function equivalents of the `ISNA()`, `ISNAN()`, and `R_FINITE()` macros.
    `R_finite()` is false for `NA`, `NaN`, `Inf`, and `-Inf`.
  see_also: ISNA
  chapter: vectors
  section: Special values
- name: Rf_isLogical
  family:
    - Rf_isInteger
    - Rf_isReal
    - Rf_isComplex
    - Rf_isString
    - Rf_isExpression
  summary: Test if an SEXP is a vector of the given type.
  signature: |
    Rboolean Rf_isLogical(SEXP s);
    Rboolean Rf_isInteger(SEXP s);
    Rboolean Rf_isReal(SEXP s);
    Rboolean Rf_isComplex(SEXP s);
    Rboolean Rf_isString(SEXP s);
    Rboolean Rf_isExpression(SEXP s);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  r_equivalent: is.logical()
  args:
    s: any SEXP.
  notes: |
    No function tests for `RAWSXP` or `VECSXP`; use `TYPEOF(x) == RAWSXP` or
    `TYPEOF(x) == VECSXP` instead. Factors are also `INTSXP`s, so
    `TYPEOF(x) == INTSXP` accepts both plain integer vectors and factors;
    combine `Rf_isInteger()` with `Rf_isFactor()` to distinguish them.
  see_also:
    - Rf_isNewList
    - Rf_isFactor
  chapter: vectors
  section: Test
- name: Rf_isNewList
  family:
    - Rf_isVectorAtomic
    - Rf_isVectorList
    - Rf_isVector
    - Rf_isNumber
    - Rf_isNumeric
  summary: Test for frequently used combinations of vector types.
  signature: |
    Rboolean Rf_isNewList(SEXP s);
    Rboolean Rf_isVectorAtomic(SEXP s);
    Rboolean Rf_isVectorList(SEXP s);
    Rboolean Rf_isVector(SEXP s);
    Rboolean Rf_isNumber(SEXP s);
    Rboolean Rf_isNumeric(SEXP s);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  args:
    s: any SEXP.
  notes: |
    `Rf_isNewList()` matches `NILSXP`/`VECSXP`; `Rf_isVectorAtomic()` matches
    `LGLSXP`/`INTSXP`/`REALSXP`/`CPLXSXP`/`STRSXP`/`RAWSXP`;
    `Rf_isVectorList()` matches `LISTSXP`/`EXPRSXP`; `Rf_isVector()` is their
    union; `Rf_isNumber()` and `Rf_isNumeric()` match `LGLSXP`/`REALSXP`/
    `CPLXSXP` and non-factor `INTSXP`. Results can diverge from their R
    equivalents: `Rf_isVectorAtomic(R_NilValue)` is false (`is.atomic(NULL)`
    is true) while `Rf_isNewList(R_NilValue)` is true (`is.list(NULL)` is
    false); consider writing your own wrapper around `TYPEOF(x)` instead.
  see_also: Rf_isLogical
  chapter: vectors
  section: Test
- name: Rf_copyVector
  family: []
  summary: Copy from one vector to another, recycling as necessary.
  signature: |
    void Rf_copyVector(SEXP source, SEXP target);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: can-throw
  args:
    source: the vector to copy from.
    target: the vector to copy to.
  notes: |
    Use `Rf_duplicate()` instead if you just want to duplicate a vector
    without recycling.
  see_also: Rf_copyMatrix
  chapter: vectors
