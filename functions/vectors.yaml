- name: NA_LOGICAL
  family:
    - NA_INTEGER
    - NA_STRING
  summary: Represent missing logical, integer, and character values.
  signature: |
    #define NA_LOGICAL R_NaInt
    #define NA_INTEGER R_NaInt
    #define NA_STRING  R_NaString
  status: api
  header: R_ext/Arith.h
  protect: n/a
  errors: never
  r_equivalent: NA
  notes: |
    `NA_LOGICAL` and `NA_INTEGER` are both `R_NaInt` (currently `INT_MIN`);
