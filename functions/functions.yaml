- name: Rf_isFunction
  family: Rf_isPrimitive
  summary: Test whether an object is a function or a primitive function.
  signature: |
    Rboolean Rf_isFunction(SEXP);
    Rboolean Rf_isPrimitive(SEXP);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  r_equivalent: is.function()
  notes: |
    `FUNSXP` is an abstract union type.
  see_also: []
  chapter: functions
  section: Testing functions
- name: R_UnboundValue
  family: []
  summary: Access the unbound-value marker constant.
  signature: |
    LibExtern SEXP	R_UnboundValue;	    /* Unbound marker */
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  notes: |
    `R_UnboundValue` marks an unbound symbol or an unread promise value.
  see_also: R_MissingArg
  chapter: functions
  section: Promises (`PROMSXP`)
- name: R_Srcref
  family: []
  summary: Access the current srcref, for debuggers.
  signature: |
    LibExtern SEXP	R_Srcref;           /* Current srcref, for debuggers */
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  see_also: []
  chapter: functions
  section: Srcrefs
- name: R_GetCurrentSrcref
  family: R_GetSrcFilename
  summary: Get the current srcref or the source filename of a srcref.
  signature: |
    SEXP R_GetCurrentSrcref(int);
    SEXP R_GetSrcFilename(SEXP);
  status: api
  header: Rinternals.h
  protect: result
  errors: never
  see_also: []
  chapter: functions
  section: Srcrefs
- name: R_mkClosure
  family: []
  summary: Create a closure from formals, body, and environment.
  signature: |
    SEXP R_mkClosure(SEXP formals, SEXP body, SEXP env);
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  since: 4.5.0
  r_equivalent: as.function()
  notes: |
    The API replacement for the non-API idiom `Rf_allocSExp(CLOSXP)` +
    `SET_FORMALS`/`SET_BODY`/`SET_CLOENV`. Checks that `formals` is a
    well-formed pairlist of formal arguments.
  see_also: [R_ClosureFormals]
  chapter: functions
  section: Closures
- name: R_ClosureFormals
  family:
    - R_ClosureBody
    - R_ClosureEnv
  summary: Access the formals, body, or environment of a closure.
  signature: |
    SEXP R_ClosureFormals(SEXP x);
    SEXP R_ClosureBody(SEXP x);
    SEXP R_ClosureEnv(SEXP x);
  status: api
  header: Rinternals.h
  protect: not-needed
  errors: never
  since: 4.5.0
  r_equivalent: formals()
  notes: |
    The API replacements for `FORMALS()`, `BODY()`, and `CLOENV()`.
  see_also: [R_mkClosure]
  chapter: functions
  section: Closures
- name: R_ClosureExpr
  family: BODY_EXPR
  summary: Get the body expression of a closure.
  signature: |
    SEXP R_ClosureExpr(SEXP);
    #define BODY_EXPR(e) R_ClosureExpr(e)
  status: api
  header: Rinternals.h
  protect: not-needed
  errors: never
  notes: |
    Returns the unevaluated body, like `body()` at the R level.
  see_also:
    - R_ClosureFormals
    - R_mkClosure
  chapter: functions
  section: Closures
- name: R_BytecodeExpr
  family: []
  summary: Get the byte-compiled form of a closure's body.
  signature: |
    SEXP R_BytecodeExpr(SEXP e);
  status: api
  header: Rinternals.h
  protect: not-needed
  errors: never
  notes: |
    Returns a `BCODESXP` if the closure has been byte-compiled, and
    `R_NilValue` otherwise.
  see_also: R_ClosureExpr
  chapter: functions
  section: Closures
