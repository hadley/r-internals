- name: Rf_isFunction
  family: Rf_isPrimitive
  summary: Test whether an object is a function or a primitive function.
  signature: |
    Rboolean Rf_isFunction(SEXP);
    Rboolean Rf_isPrimitive(SEXP);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  r_equivalent: is.function()
  notes: |
    `FUNSXP` is an abstract union type.
  see_also: []
  chapter: functions
  section: Testing functions
- name: R_UnboundValue
