  errors: never
  r_equivalent: is.factor()
  args:
    x: any SEXP.
  see_also:
    - Rf_nlevels
    - Rf_asCharacterFactor
  chapter: attributes
  section: Factors
- name: Rf_nlevels
  family: []
  summary: Get the number of levels of a factor.
  signature: |
