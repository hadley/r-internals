  see_also: Rf_copyMostAttrib
  chapter: attributes
  section: Get and set
- name: Rf_isArray
  family: []
  summary: Test if an object is an array.
  signature: |
    Rboolean Rf_isArray(SEXP x);
  returns: "`TRUE` if `x` is an array (a vector with a `dim` attribute), otherwise `FALSE`."
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  r_equivalent: is.array()
  args:
    x: any SEXP.
  notes: |
    Arrays are vectors with a dim attribute.
  see_also:
    - Rf_allocArray
