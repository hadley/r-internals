  see_also: Rf_isFactor
  chapter: attributes
  section: Factors
- name: Rf_asCharacterFactor
  family: []
  summary: Coerce a factor into a character vector.
  signature: |
    SEXP Rf_asCharacterFactor(SEXP x);
