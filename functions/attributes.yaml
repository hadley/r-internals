  args:
    x: a factor.
  see_also: Rf_isFactor
  chapter: attributes
  section: Factors
- name: Rf_namesgets
  family: []
  summary: Set the names of a vector.
  signature: |
    SEXP Rf_namesgets(SEXP, SEXP);
  status: api
  header: Rinternals.h
  protect: not-needed
  errors: can-throw
  r_equivalent: names<-()
  see_also: []
  chapter: attributes
