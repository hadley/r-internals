- name: Rf_findFun
  family: []
  summary: >-
    Find the function bound to a symbol in an environment and its enclosing
    environments.
  signature: |
    SEXP Rf_findFun(SEXP symbol, SEXP environment);
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  notes: |
    Like `Rf_findVar()`, but ignores non-functions.
  see_also: Rf_findVar
  chapter: environments
  section: Get values
- name: Rf_defineVar
  family: []
  summary: Bind a symbol to a value in an environment.
  signature: |
    void Rf_defineVar(SEXP symbol, SEXP value, SEXP env);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: can-throw
  notes: |
    To remove a binding, set its value to `R_UnboundSymbol`.
  see_also: []
  chapter: environments
  section: Set values
- name: R_lsInternal3
  family: R_lsInternal
  summary: List the names bound in an environment.
  signature: |
    SEXP R_lsInternal3(SEXP env, Rboolean all_names, Rboolean sorted);
    SEXP R_lsInternal(SEXP, Rboolean);
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  notes: |
    Returns a character vector. `R_lsInternal(env, all)` is shorthand for
    `R_lsInternal3(env, all, TRUE)` but is not part of the API; prefer
    `R_lsInternal3()` directly.
  see_also: []
  chapter: environments
  section: Check for presence
- name: Rf_isEnvironment
  family: []
  summary: Test whether an object is an environment.
  signature: |
    Rboolean Rf_isEnvironment(SEXP x);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: never
  notes: |
    Equivalent to `TYPEOF(x) == ENVSXP`.
  see_also: []
  chapter: environments
  section: Miscellaneous
