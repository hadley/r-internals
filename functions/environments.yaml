  see_also: []
  chapter: environments
  section: Creation
- name: Rf_findVar
  family: []
  summary: Find the value bound to a symbol in an environment and its enclosing environments.
  signature: |
    SEXP Rf_findVar(SEXP symbol, SEXP environment);
  status: non-api
  replacement: R_getVar
  header: Rinternals.h
  protect: result
  errors: can-throw
  notes: |
    May allocate, since the binding it finds could be an active binding.
    Too low level to be part of the API; prefer `R_getVar()` or
    `R_getVarEx()` (added in R 4.5.0) in new code.
  see_also:
    - Rf_findFun
    - Rf_findVarInFrame3
  chapter: environments
  section: Get values
- name: Rf_findFun
  family: []
  summary: Find the function bound to a symbol in an environment and its enclosing environments.
  signature: |
    SEXP Rf_findFun(SEXP symbol, SEXP environment);
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  notes: |
    Like `Rf_findVar()`, but ignores non-functions.
  see_also: Rf_findVar
  chapter: environments
  section: Get values
- name: Rf_findVarInFrame3
  family: Rf_findVarInFrame
  summary: "Find a symbol in a single environment, without searching enclosing environments."
  signature: |
    SEXP Rf_findVarInFrame3(SEXP env, SEXP symbol, Rboolean doGet);
    SEXP Rf_findVarInFrame(SEXP env, SEXP symbol);
  status: non-api
  replacement: R_getVar
  header: Rinternals.h
  protect: result
  errors: can-throw
  args:
    doGet: "if `TRUE`, returns the value; if `FALSE`, just checks for presence."
  notes: |
    Returns `R_UnboundValue` if not found. `Rf_findVarInFrame()` is shorthand
    for `Rf_findVarInFrame3(rho, symbol, TRUE)`. Too low level to be part of
    the API; prefer `R_getVar()` or `R_getVarEx()` (added in R 4.5.0) to
    retrieve a value and `R_existsVarInFrame()` to test for existence.
  see_also: Rf_findVar
  chapter: environments
  section: Get values
- name: Rf_defineVar
  family: []
  summary: Bind a symbol to a value in an environment.
  signature: |
    void Rf_defineVar(SEXP symbol, SEXP value, SEXP env);
  status: api
  header: Rinternals.h
  protect: n/a
  errors: can-throw
  notes: |
    To remove a binding, set its value to `R_UnboundSymbol`.
  see_also: []
  chapter: environments
  section: Set values
- name: Rf_addMissingVarsToNewEnv
  family: []
  summary: Copy variables into a new environment unless already present.
  signature: |
    void Rf_addMissingVarsToNewEnv(SEXP to, SEXP from);
  status: non-api
  header: Rinternals.h
  protect: n/a
  errors: can-throw
  notes: |
    Copies variables from `from` (a `VECSXP`) unless already present in `to`.
  see_also: []
  chapter: environments
  section: Set values
- name: R_lsInternal3
  family: R_lsInternal
  summary: List the names bound in an environment.
  signature: |
    SEXP R_lsInternal3(SEXP env, Rboolean all_names, Rboolean sorted);
    SEXP R_lsInternal(SEXP, Rboolean);
  status: api
  header: Rinternals.h
  protect: result
  errors: can-throw
  notes: |
    Returns a character vector. `R_lsInternal(env, all)` is shorthand for
    `R_lsInternal3(env, all, TRUE)` but is not part of the API; prefer
    `R_lsInternal3()` directly.
  see_also: []
  chapter: environments
  section: Check for presence
- name: Rf_isEnvironment
