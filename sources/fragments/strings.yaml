- name: Rf_translateCharUTF8
  family: [Rf_translateChar, Rf_translateChar0]
  summary: Translate a CHARSXP to a C string in a specified encoding.
  signature: |
    const char* Rf_translateChar(SEXP x);
    const char* Rf_translateChar0(SEXP x);
    const char* Rf_translateCharUTF8(SEXP x);
  status: api
  replacement: ~
  header: Rinternals.h
  protect: not-needed
  errors: can-throw
  since: ~
  r_equivalent: ~
  args: ~
  notes: |
    `Rf_translateChar()` translates to the native encoding;
    `Rf_translateChar0()` returns the string as is if bytes, otherwise
    translates to native encoding; `Rf_translateCharUTF8()` translates to
    UTF-8. Most modern C APIs use UTF-8, so you almost always want
    `Rf_translateCharUTF8()`. If re-encoding is necessary, the `char*` will
    be allocated by `R_alloc()` and will be automatically freed at the end
    of the call to `.C`, `.Call`, or `.External`; if you want to save it
    across calls to C, make a copy.
  example: ~
  see_also: [CHAR]
  chapter: strings
  section: Convert to C string

