- name: R_RegisterCFinalizer
  family: [R_RegisterFinalizer, R_RegisterFinalizerEx, R_RegisterCFinalizerEx]
  summary: Register a finalizer to run when an external pointer is garbage collected.
  signature: |
    void R_RegisterFinalizer(SEXP s, SEXP fun);
    void R_RegisterCFinalizer(SEXP s, R_CFinalizer_t fun);
    void R_RegisterFinalizerEx(SEXP s, SEXP fun, Rboolean onexit);
    void R_RegisterCFinalizerEx(SEXP s, R_CFinalizer_t fun, Rboolean onexit);
  status: api
  replacement: ~
  header: Rinternals.h
  protect: n/a
  errors: can-throw
  since: ~
  r_equivalent: ~
  args: ~
  notes: |
    `R_RegisterFinalizer` registers an R function and `R_RegisterCFinalizer`
    registers a C function of type `R_CFinalizer_t` to be run when `s` is
    garbage collected. The `Ex` variants add an `onexit` argument controlling
    whether the finalizer is also run when R shuts down.
  example: ~
  see_also: []
  chapter: external-pointers
  section: Finalization

