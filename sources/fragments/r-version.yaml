# Function records for r-version.qmd (chapter key: "r-version").
# Rendered into the chapter by tools/render-entries.R.

- name: R_Version
  family: [R_VERSION]
  summary: Test the compile-time version of R against a required version.
  signature: |
    #define R_VERSION
    #define R_Version(major, minor, patch) \
      (((major) * 65536) + ((minor) * 256) + (patch))
  status: api
  replacement: ~
  header: Rversion.h
  protect: n/a
  errors: never
  since: ~
  r_equivalent: R.version
  args: ~
  notes: |
    Used to test the current version of R. `R_VERSION` is the packed
    version number of the R being compiled against; `R_Version()` packs
    a `major.minor.patch` triple into the same format for comparison.
  example: |
    #include <Rversion.h>

    #if defined(R_VERSION) && R_VERSION < R_Version(3, 2, 0)
    SEXP Rf_installChar(SEXP x) {
      return Rf_install(CHAR(x));
    }
    #endif
  see_also: []
  chapter: r-version
  section: '`Rversion.h`'
