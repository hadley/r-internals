- name: R_Serialize
  family: [R_Unserialize]
  summary: Serialise an R object to an output stream, or unserialise it from an input stream.
  signature: |
    void R_Serialize(SEXP s, R_outpstream_t ops);
    SEXP R_Unserialize(R_inpstream_t ips);
  status: api
  replacement: ~
  header: Rinternals.h
  protect: result
  errors: can-throw
  since: ~
  r_equivalent: serialize()
  args: ~
  notes: |
    The R equivalents are `serialize()` and `unserialize()`. The `SEXP`
    returned by `R_Unserialize()` is freshly allocated and should be
    protected from garbage collection.
  example: ~
  see_also: []
  chapter: serialisation
  section: Serialising objects

