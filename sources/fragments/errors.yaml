- name: R_tryEval
  family: [R_tryEvalSilent]
  summary: Evaluate an R expression in a stand-alone context so errors don't longjmp.
  signature: |
    SEXP R_tryEval(SEXP expression, SEXP environment, int* pOutError);
    SEXP R_tryEvalSilent(SEXP expression, SEXP environment, int* pOutError);
  status: api
  replacement: ~
  header: Rinternals.h
  protect: result
  errors: never
  since: ~
  r_equivalent: try()
  args:
    pOutError: On error, the function returns NULL and sets the contents of `pOutError` to 1.
  notes: |
    Use these to evaluate R expressions in a stand-alone context ensuring that
    any errors produced during evaluation don't cause a longjmp to a separate
    context. `R_tryEvalSilent()` is the same as `R_tryEval()`, but doesn't
    print error messages. Note that these functions ignore all existing
    condition handlers so R functions like `supressWarnings()`, `tryCatch()`,
    will no longer work.
  example: ~
  see_also: [R_ToplevelExec]
  chapter: errors
  section: Protected evaluation

