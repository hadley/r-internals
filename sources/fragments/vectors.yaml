- name: Rf_xlength
  family: Rf_length
  summary: Get the length of a vector.
  signature: |
    R_xlen_t Rf_xlength(SEXP x);
    R_len_t Rf_length(SEXP x);
  status: api
  replacement: ~
  header: Rinternals.h
  protect: not-needed
  errors: never
  since: ~
  r_equivalent: length()
  args:
    x: any vector.
  notes: |
    `Rf_xlength()` uses `R_xlen_t` and supports long vectors (length up to
    2^64 - 1, since R 3.0.0); `Rf_length()` is limited to `int` (2^31 - 1).
    Also works on pairlists, where it is O(n).
  example: ~
  see_also:
    - Rf_lengthgets
    - LENGTH
  chapter: vectors
  section: Length
