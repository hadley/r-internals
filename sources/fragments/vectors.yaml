- name: LOGICAL
  family:
    - INTEGER
    - REAL
    - COMPLEX
    - RAW
  summary: Get a pointer to the underlying C array of an atomic vector.
  signature: |
    int*      LOGICAL(SEXP x);
    int*      INTEGER(SEXP x);
    double*   REAL(SEXP x);
    Rcomplex* COMPLEX(SEXP x);
    Rbyte*    RAW(SEXP x);
  status: api
  replacement: ~
  header: Rinternals.h
  protect: not-needed
  errors: never
  since: ~
  r_equivalent: ~
  args:
    x: a vector of the corresponding type.
  notes: |
    For long vectors, cache the returned pointer and reuse it rather than
    calling the accessor on every iteration.
  example: |
    int* px = INTEGER(x);
    for (int i = 0; i < n; ++i) {
      px[i] = px[i] * 2;
    }
  see_also:
    - STRING_ELT
    - VECTOR_ELT
  chapter: vectors
  section: Get and set values
