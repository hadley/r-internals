- name: Rf_isNewList
  family: [Rf_isVectorAtomic, Rf_isVectorList, Rf_isVector, Rf_isNumber, Rf_isNumeric]
  summary: Test for frequently used combinations of vector types.
  signature: |
    Rboolean Rf_isNewList(SEXP s);
    Rboolean Rf_isVectorAtomic(SEXP s);
    Rboolean Rf_isVectorList(SEXP s);
    Rboolean Rf_isVector(SEXP s);
    Rboolean Rf_isNumber(SEXP s);
    Rboolean Rf_isNumeric(SEXP s);
  status: api
  replacement: ~
  header: Rinternals.h
  protect: not-needed
  errors: never
  since: ~
  r_equivalent: ~
  args:
    s: any SEXP.
  notes: |
    `Rf_isNewList()`: `NILSXP`, `VECSXP`. `Rf_isVectorAtomic()`: `LGLSXP`,
    `INTSXP`, `REALSXP`, `CPLXSXP`, `STRSXP`, `RAWSXP`. `Rf_isVectorList()`:
    `LISTSXP`, `EXPRSXP`. `Rf_isVector()`: `isVectorAtomic(x) ||
    isVectorList()`. `Rf_isNumber()`: `INTSXP` (but not factor), `LGLSXP`,
    `REALSXP`, `CPLXSXP`. `Rf_isNumeric()`: `INTSXP` (but not factor),
    `REALSXP`, `CPLXSXP`. These are not always consistent with their R
    equivalents: `Rf_isVectorAtomic(R_NilValue)` is false but
    `is.atomic(NULL)` is true, and `Rf_isNewList(R_NilValue)` is true but
    `is.list(NULL)` is false (somewhat strange, given that `R_NilValue` is
    just an empty pairlist, i.e. `NULL` and `pairlist()` are identical).
    Because of this confusion, I recommend writing your own wrapper around
    `TYPEOF(x)`.
  example: ~
  see_also: [Rf_isLogical]
  chapter: vectors
  section: Test

