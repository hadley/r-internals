    There's no function to test for `RAWSXP` or `VECSXP`; you must use
    `TYPEOF(x) == RAWSXP` or `TYPEOF(x) == VECSXP`. (`isList()` tests if the
    object is a pairlist.) Be careful when checking whether an R object is an
