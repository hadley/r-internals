    are still shorter than this, so the `int`-based `Rf_length()` interface
    suffices. As of R 3.0.0, vectors can have length up to 2^64 - 1; use the
    `R_xlen_t`-based `Rf_xlength()` if you want your code to be as general as
    possible. Also works on pairlists, where it is O(n).
