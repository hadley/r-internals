- name: R_orderVector
  family: [R_orderVector1]
  summary: Compute an ordering permutation into an index array.
  signature: |
    void R_orderVector (int *indx, int n, SEXP arglist, Rboolean nalast, Rboolean decreasing);
    void R_orderVector1(int *indx, int n, SEXP x,       Rboolean nalast, Rboolean decreasing);
  status: api
  replacement: ~
  header: Rinternals.h
  protect: n/a
  errors: never
  since: ~
  r_equivalent: order()
  args: ~
  notes: |
    C version of R's `indx <- order(..., na.last, decreasing)`; `arglist`
    can be built with e.g. `Rf_lang2(x, y)` or `Rf_lang3(x, y, z)`.
    `R_orderVector1()` is the single-vector version,
    `indx <- order(x, na.last, decreasing)`.
