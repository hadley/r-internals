  status: api
  replacement: ~
  header: Rinternals.h
  protect: n/a
  errors: never
  since: ~
  r_equivalent: identical()
  args: ~
  notes: |
    The third arg consists of bitmapped flags for non-default options:
    currently the first 4 and the 6th default to TRUE, so the flag is
    set for FALSE values: 1 = !NUM_EQ, 2 = !SINGLE_NA, 4 = !ATTR_AS_SET,
    8 = !IGNORE_BYTECODE, 16 = !IGNORE_ENV, 32 = !IGNORE_SRCREF.
    Default from R's default: 16 = (0 + 0 + 0 + 0 + 16 + 0).
  example: ~
