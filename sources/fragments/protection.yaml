- name: R_ProtectWithIndex
  family: [R_Reprotect]
  summary: Protect an object at a fixed stack location so its value can be replaced later.
  signature: |
    void R_ProtectWithIndex(SEXP, PROTECT_INDEX *);
    void R_Reprotect(SEXP, PROTECT_INDEX);
  status: api
  replacement: ~
  header: Rinternals.h
  protect: n/a
  errors: never
  since: ~
  r_equivalent: ~
  args: ~
  notes: |
    We sometimes need to coerce a protected value and place the new
    coerced value under protection. For these cases `PROTECT_WITH_INDEX`
    saves an index of the protection location that can be used to replace
    the protected value using `REPROTECT`. These are the functions behind
    those macros.
  example: ~
  see_also: [PROTECT]
  chapter: protection
  section: Protect

