- name: MAYBE_SHARED
  family: [NO_REFERENCES, MAYBE_REFERENCED, NOT_SHARED, MARK_NOT_MUTABLE]
  summary: Test or set an object's reference-count flags before modifying it in place.
  signature: |
    #define MAYBE_SHARED(x) (NAMED(x) > 1)
    #define NO_REFERENCES(x) (NAMED(x) == 0)
    #define MARK_NOT_MUTABLE(x) SET_NAMED(x, NAMEDMAX)
    #define MAYBE_REFERENCED(x) (! NO_REFERENCES(x))
    #define NOT_SHARED(x) (! MAYBE_SHARED(x))
  status: api
  replacement: ~
  header: Rinternals.h
  protect: n/a
  errors: never
  since: ~
  r_equivalent: ~
  args: ~
  notes: |
    You must be very careful when modifying function inputs. These macros
    test the `NAMED` reference count so you can tell whether an object may
    be shared before changing it in place.
  example: ~
  see_also: [Rf_duplicate]
  chapter: protection
  section: Reference counting

