- name: R_PreserveObject
  family: [R_ReleaseObject]
  summary: Preserve an object across C calls by adding it to R's precious list.
  signature: |
    void R_PreserveObject(SEXP);
    void R_ReleaseObject(SEXP);
  status: api
  replacement: ~
  header: Rinternals.h
  protect: n/a
  errors: never
  since: ~
  r_equivalent: ~
  args: ~
  notes: |
    The primary structure that R uses for protecting objects is the
    so-called `R_PreciousList`, which is just a pairlist of `SEXP`s; the
    `R_PPStack` protection stack is part of this list. These functions need
    to be used with care: because `R_ReleaseObject()` performs a recursive
    search for the object to release, inserting and later removing many
    `SEXP`s in the same order can cause performance regressions. See
    [this dplyr issue](https://github.com/hadley/dplyr/issues/1396) for an
    interesting manifestation of this problem.
  example: ~
  see_also: [PROTECT]
  chapter: protection
  section: R_PreserveObject, R_ReleaseObject

