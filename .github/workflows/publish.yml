name: Render and publish

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      # knitr runs `results: asis` chunks that inject generated function
      # entries from functions/*.yaml
      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            knitr
            yaml12
            jsonlite

      # Coverage audit + functions.json; fails on rot, warns on gaps
      - name: Build index and audit coverage
        run: Rscript tools/build-index.R

      - name: Render
        run: |
          quarto render
          cp functions.json _site/

      # Publish only from the default branch, not PRs
      - uses: quarto-dev/quarto-actions/publish@v2
        if: github.event_name != 'pull_request'
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
